[project]
name = "shopware-docs-rag"
version = "0.1.0"
description = "Retrieval-augmented Q&A over the official Shopware 6 developer docs, with citations and a reproducible eval harness."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # API + configuration
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Vector store + local ONNX models (dense, BM25 sparse, cross-encoder rerank)
    "qdrant-client>=1.15",
    "fastembed>=0.7",
    # LLM providers (only the one selected in .env is used at runtime)
    "anthropic>=0.60",
    "openai>=1.40",
    "httpx>=0.27",
    # Parsing + token counting
    "markdown-it-py>=3.0",
    "python-frontmatter>=1.1",
    "tiktoken>=0.7",
    # Agent (POST /agent): LangGraph state machine + LangChain chat models with tool calling
    "langgraph>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "langchain-ollama>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant"]
